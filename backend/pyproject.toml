[project]
name = "backend"
version = "0.1.0"
description = "Weles backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "notion-client>=2.0.0",
    "pydantic-ai-slim>=0.0.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "basedpyright>=1.39.10",
    "pytest-bdd>=8.1.0",
    "mutmut>=3.7.0",
    "hypothesis>=6.165.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
bdd_features_base_dir = "tests/features"
asyncio_mode = "auto"
markers = [
    "bdd: Gherkin tag applied by pytest-bdd (effort id or AC-nn)",
    "capture-flow: capture-flow effort acceptance scenarios",
    "AC-01: acceptance criterion 01",
    "AC-02: acceptance criterion 02",
    "AC-03: acceptance criterion 03",
    "AC-04: acceptance criterion 04",
    "AC-05: acceptance criterion 05",
    "AC-06: acceptance criterion 06",
    "AC-07: acceptance criterion 07",
    "AC-08: acceptance criterion 08",
    "AC-09: acceptance criterion 09",
    "AC-10: acceptance criterion 10",
    "AC-11: acceptance criterion 11",
    "AC-12: acceptance criterion 12",
    "AC-13: acceptance criterion 13",
    "AC-14: acceptance criterion 14",
    "AC-15: acceptance criterion 15",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"

[tool.mutmut]
source_paths = ["src"]
pytest_add_cli_args_test_selection = ["tests/"]
