name: deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA on main to deploy"
        required: true
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve commit SHA
        id: resolve-sha
        run: |
          sha="$(git rev-parse --verify "${{ inputs.sha }}^{commit}" 2>/dev/null)" || {
            echo "::error::unknown ref: ${{ inputs.sha }}"
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Require the SHA is on main
        run: |
          sha="${{ steps.resolve-sha.outputs.sha }}"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not an ancestor of origin/main"
            exit 1
          fi

      - name: Require green required checks and a successful integration run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve-sha.outputs.sha }}
        run: |
          failures=()

          required_contexts="$(jq -r '
            .rules[]
            | select(.type == "required_status_checks")
            | .parameters.required_status_checks[].context
          ' .github/rulesets/main.json)"

          while IFS= read -r context; do
            [ -z "$context" ] && continue
            run="$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" --paginate --jq "
              [.check_runs[] | select(.name == \"$context\")] | sort_by(.started_at) | last
            ")"
            if [ -z "$run" ] || [ "$run" = "null" ]; then
              failures+=("missing check run: $context")
              continue
            fi
            status="$(echo "$run" | jq -r '.status')"
            conclusion="$(echo "$run" | jq -r '.conclusion')"
            if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
              failures+=("check run not successful: $context (status=$status, conclusion=$conclusion)")
            fi
          done <<<"$required_contexts"

          integration_status="$(gh api "repos/${{ github.repository }}/commits/$SHA/statuses" --paginate --jq '
            [.[] | select(.context == "integration")] | sort_by(.created_at) | last
          ')"
          if [ -z "$integration_status" ] || [ "$integration_status" = "null" ]; then
            failures+=("missing integration status")
          else
            state="$(echo "$integration_status" | jq -r '.state')"
            if [ "$state" != "success" ]; then
              failures+=("integration status not successful: state=$state")
            fi
          fi

          if [ "${#failures[@]}" -gt 0 ]; then
            printf '::error::%s\n' "${failures[@]}"
            exit 1
          fi

  deploy:
    name: deploy
    needs: verify
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHA: ${{ needs.verify.outputs.sha }}
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Build image
        run: docker build -t "weles-api:$SHA" backend

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ship image to the VPS
        run: |
          docker save "weles-api:$SHA" | gzip | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_SSH_PORT" \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" 'gunzip | docker load'

      - name: Ship deploy files to the VPS
        run: |
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_SSH_PORT" \
            deploy/compose.yml deploy/remote-deploy.sh \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:/srv/weles/"

      - name: Switch the API to the deployed SHA
        id: switch
        run: |
          if ssh -i ~/.ssh/deploy_key -p "$DEPLOY_SSH_PORT" "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "bash /srv/weles/remote-deploy.sh $SHA"; then
            echo "outcome=success" >>"$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >>"$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Record the outcome
        if: always()
        run: |
          {
            echo "### Deploy $SHA"
            echo "outcome: ${{ steps.switch.outputs.outcome || 'failure' }}"
          } >>"$GITHUB_STEP_SUMMARY"
