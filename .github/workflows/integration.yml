name: integration

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, branch, or tag to run the integration suite against"
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref }}

jobs:
  backend-integration:
    name: backend-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: weles
          POSTGRES_PASSWORD: weles
          POSTGRES_DB: weles
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weles -d weles"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://weles:weles@127.0.0.1:5432/weles_test
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Resolve commit SHA
        id: resolve-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ steps.resolve-sha.outputs.sha }}" \
            -f state=pending \
            -f context=integration \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="Integration suite running"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          working-directory: backend
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen pytest tests/integration
      - run: uv run --frozen pytest tests/unit -m postgres
      - name: Publish commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state="failure"
          if [ "${{ job.status }}" = "success" ]; then
            state="success"
          fi
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ steps.resolve-sha.outputs.sha }}" \
            -f state="$state" \
            -f context=integration \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="Integration suite $state"
