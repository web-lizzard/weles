name: tui-release

on:
  push:
    tags:
      - "tui-v*"

permissions:
  contents: write

jobs:
  release:
    name: tui-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: tui
          runtime: node@22
          cache: true
          cache-dependency-path: tui/pnpm-lock.yaml
          require-lockfile: true
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#tui-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match package.json (${PKG_VERSION})"
            exit 1
          fi
          echo "VERSION=${TAG_VERSION}" >> "$GITHUB_ENV"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack
      - name: Copy stable tarball name
        run: cp "weles-${VERSION}.tgz" weles.tgz
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "weles-${VERSION}.tgz" weles.tgz
          --title "$GITHUB_REF_NAME"
          --generate-notes
