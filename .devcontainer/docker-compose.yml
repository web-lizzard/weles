services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    init: true
    env_file:
      - devcontainer.env
    environment:
      DATABASE_URL: postgresql+asyncpg://weles:weles@postgres:5432/weles
      TEST_DATABASE_URL: postgresql+asyncpg://weles:weles@postgres:5432/weles_test
    volumes:
      - ..:/workspaces/weles:cached
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: weles
      POSTGRES_PASSWORD: weles
      POSTGRES_DB: weles
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weles -d weles"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
